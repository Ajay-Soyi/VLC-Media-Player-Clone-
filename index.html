<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VLC Media Player</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <div class="title-bar">
        <img src="./images/VLC.png" alt="vlc logo" height="20px" />
        <h1>VLC media player</h1>
      </div>
      <div class="menu-bar">
        <div class="open-option" id="open-opt">
          <span>Open</span>
          <input type="file" id="video-file">
        </div>
        <div class="playback-option">
          <span>Playback</span>
          <ul class="list-menu-bar">
            <li id="speedUp">Speed Up</li>
            <li id="speedDown">Speed Down</li>
          </ul>
        </div>
        <div class="audio-option">
          <span>Audio</span>
          <ul class="list-menu-bar">
            <li id="volumeUp">Volume Up</li>
            <li id="volumeDown">Volume Down</li>
          </ul>
        </div>
      </div>
    </header>
    <main></main>
    <footer></footer>
    <script src="./script.js"></script>
  </body>
</html>
